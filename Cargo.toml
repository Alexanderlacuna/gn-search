[workspace]
members = ["crates/schema", "crates/engine"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
utoipa = "5"
# The native search engine's xapian bindings: the Alexanderlacuna fork of
# torrancew/xapian-rs, pinned to the rev carrying the full round-3 patch set
# (checked parse, the NumberRangeProcessor f64 fix, SI-suffix positions).
xapian-rs = { git = "https://github.com/Alexanderlacuna/xapian-rs", rev = "70c5eace78dbca29c434cb103cb8b2c5d4246f0d" }
gn-search-schema = { path = "crates/schema", version = "0.1.0" }
